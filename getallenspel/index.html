<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Getallenspel">
<meta name="theme-color" content="#0f172a">
<title>Getallenspel</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--text:#f1f5f9;--mute:#94a3b8;--acc:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",sans-serif;overscroll-behavior:none;touch-action:manipulation}
body{display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),16px) max(env(safe-area-inset-bottom),14px) max(env(safe-area-inset-left),16px);max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
header b{color:var(--text);font-size:16px}
.target{text-align:center;margin:10px 0 4px}
.target small{display:block;color:var(--mute);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.target .n{font-size:72px;font-weight:800;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.best{text-align:center;min-height:26px;font-size:15px;color:var(--mute);margin-bottom:8px}
.best b{color:var(--text)}
.best.hit b{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:0 0 auto}
.num{height:84px;border:0;border-radius:18px;background:var(--card);color:var(--text);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;transition:transform .08s,background .15s}
.num:active{transform:scale(.95)}
.num.sel{background:var(--acc);color:#0f172a}
.num.gone{visibility:hidden}
.num.new{animation:pop .25s}
.num.closest{box-shadow:inset 0 0 0 3px var(--warn)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.op{height:64px;border:0;border-radius:16px;background:var(--card2);color:var(--text);font-size:32px;font-weight:600}
.op.sel{background:var(--warn);color:#0f172a}
.op:active{transform:scale(.95)}
.log{flex:1;min-height:40px;overflow:auto;font-size:15px;color:var(--mute);line-height:1.6;-webkit-user-select:text;user-select:text}
.log div:last-child{color:var(--text)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.btn{height:54px;border:0;border-radius:14px;background:var(--card);color:var(--text);font-size:17px;font-weight:600}
.btn.main{background:var(--ok);color:#052e16}
.btn:disabled{opacity:.35}
.btn:active{transform:scale(.97)}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.8);display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
.modal.show{display:flex}
.box{background:var(--card);border-radius:24px;padding:26px 22px;text-align:center;width:100%;max-width:360px}
.box h2{margin:0 0 6px;font-size:26px}
.box p{margin:6px 0;color:var(--mute);font-size:16px}
.box .big{font-size:48px;font-weight:800;color:var(--acc);margin:6px 0}
.box .btn{width:100%;margin-top:14px}
.box small{display:block;color:var(--mute);margin-top:12px;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<header><span>Ronde <b id="round">1</b></span><span>Score <b id="score">0</b></span><span>Record <b id="rec">0</b></span></header>
<div class="target"><small>Doel</small><div class="n" id="target">0</div></div>
<div class="best" id="best"></div>
<div class="grid" id="grid"></div>
<div class="ops" id="ops"></div>
<div class="log" id="log"></div>
<div class="bar">
  <button class="btn" id="undo">↶ Terug</button>
  <button class="btn" id="reset">Opnieuw</button>
  </div>
<div class="modal" id="modal"><div class="box">
  <h2 id="mTitle"></h2><div class="big" id="mNum"></div><p id="mText"></p><p id="mPts"></p>
  <button class="btn main" id="next">Volgende ronde</button>
  <small id="mHelp"></small>
</div></div>
<script>
(function(){
"use strict";
var OPS=["+","−","×","÷"];
var $=function(id){return document.getElementById(id)};
var st={round:1,score:0,target:0,start:[],items:[],hist:[],sel:null,op:null,log:[],solution:"",over:false};
var rec=0;
try{rec=+localStorage.getItem("gs_rec")||0}catch(e){}
$("rec").textContent=rec;

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
var MIN=1,MAX=999;
function apply(a,op,b){
  var r;
  switch(op){
    case 0:r=a+b;break;
    case 1:r=a-b;break;
    case 2:r=a*b;break;
    default:r=(b!==0&&a%b===0)?a/b:null;
  }
  return(r!==null&&r>=MIN&&r<=MAX)?r:null;
}
// Maak een doel dat zeker haalbaar is: speel willekeurig een route met de 5 getallen.
function newPuzzle(){
  for(var tries=0;tries<500;tries++){
    var nums=[];
    for(var i=0;i<5;i++)nums.push(rnd(1,10));
    if(Math.random()<.5)nums[rnd(0,4)]=[25,50,75,100][rnd(0,3)];
    var pool=nums.map(function(v){return{v:v,e:String(v)}});
    var guard=0,ok=true;
    while(pool.length>1){
      if(++guard>40){ok=false;break}
      var i1=rnd(0,pool.length-1),i2;do{i2=rnd(0,pool.length-1)}while(i2===i1);
      var o=rnd(0,3),r=apply(pool[i1].v,o,pool[i2].v);
      if(r===null)continue;
      var e="("+pool[i1].e+" "+OPS[o]+" "+pool[i2].e+")";
      pool=pool.filter(function(_,k){return k!==i1&&k!==i2});
      pool.push({v:r,e:e});
    }
    var last=pool[0];
    if(ok&&pool.length===1&&last.v>=MIN&&last.v<=MAX&&nums.indexOf(last.v)<0){
      return{nums:nums,target:last.v,solution:last.e.replace(/^\((.*)\)$/,"$1")+" = "+last.v};
    }
  }
  return{nums:[1,2,3,4,5],target:60,solution:"((1 + 2) × 4) × 5 = 60"};
}
function fmt(n){return String(n)}

function startRound(){
  var p=newPuzzle();
  st.target=p.target;st.start=p.nums;st.solution=p.solution;st.over=false;
  resetBoard();
  $("target").textContent=p.target;
  $("round").textContent=st.round;
  $("modal").classList.remove("show");
}
function resetBoard(){
  st.items=st.start.map(function(v){return{v:v,fresh:false}});
  st.hist=[];st.sel=null;st.op=null;st.log=[];
  render();
}
function closest(){
  var best=null;
  st.items.forEach(function(it,i){
    var d=Math.abs(it.v-st.target);
    if(best===null||d<best.d)best={d:d,i:i,v:it.v};
  });
  return best;
}
function render(){
  var g=$("grid");g.innerHTML="";
  var c=closest();
  st.items.forEach(function(it,i){
    var b=document.createElement("button");
    b.className="num"+(st.sel===i?" sel":"")+(it.fresh?" new":"")+"";
    b.textContent=fmt(it.v);
    b.addEventListener("click",function(){pickNum(i)});
    g.appendChild(b);
  });
  // lege plekken zodat het raster niet verspringt
  for(var k=st.items.length;k<5;k++){var e=document.createElement("button");e.className="num gone";g.appendChild(e)}
  var ops=$("ops");ops.innerHTML="";
  OPS.forEach(function(o,i){
    var b=document.createElement("button");
    b.className="op"+(st.op===i?" sel":"");b.textContent=o;
    b.addEventListener("click",function(){pickOp(i)});
    ops.appendChild(b);
  });
  var best=$("best");
  best.className="best";
  var left=st.items.length-1;
  best.innerHTML="Gebruik alle getallen · nog <b>"+left+"</b> "+(left===1?"bewerking":"bewerkingen")+" · antwoord 1–999";
  var log=$("log");log.innerHTML="";
  st.log.forEach(function(l){var d=document.createElement("div");d.textContent=l;log.appendChild(d)});
  log.scrollTop=log.scrollHeight;
  $("undo").disabled=st.hist.length===0;
  $("reset").disabled=st.hist.length===0;
  st.items.forEach(function(it){it.fresh=false});
}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function pickNum(i){
  if(st.over)return;
  if(st.sel===null){st.sel=i;render();return}
  if(st.sel===i){st.sel=null;st.op=null;render();return}
  if(st.op===null){st.sel=i;render();return}   // nog geen bewerking: andere eerste keuze
  var a=st.items[st.sel].v,b=st.items[i].v,r=apply(a,st.op,b);
  if(r===null){
    vib(40);
    flash(st.op===3?"Delen moet precies uitkomen":"Uitkomst moet tussen 1 en 999 liggen");
    st.op=null;render();return;
  }
  st.hist.push(JSON.stringify(st.items));
  st.log.push(fmt(a)+" "+OPS[st.op]+" "+fmt(b)+" = "+fmt(r));
  var keep=st.items.filter(function(_,k){return k!==st.sel&&k!==i});
  keep.push({v:r,fresh:true});
  st.items=keep;st.sel=null;st.op=null;
  render();vib(10);
  if(st.items.length===1)finish();
}
function pickOp(i){
  if(st.over)return;
  if(st.sel===null){flash("Kies eerst een getal");return}
  st.op=(st.op===i)?null:i;render();
}
function flash(t){
  var b=$("best");var old=b.innerHTML,cls=b.className;
  b.className="best";b.innerHTML="<b style='color:var(--bad)'>"+t+"</b>";
  setTimeout(function(){if(!st.over){b.innerHTML=old;b.className=cls}},1400);
}
function undo(){
  if(!st.hist.length||st.over)return;
  st.items=JSON.parse(st.hist.pop());st.log.pop();st.sel=null;st.op=null;render();
}
function points(d){
  if(d===0)return 10;
  if(d<=2)return 8;
  if(d<=5)return 6;
  if(d<=10)return 4;
  if(d<=25)return 2;
  return d<=50?1:0;
}
function finish(){
  if(st.over)return;st.over=true;
  var c=closest(),p=points(c.d);
  st.score+=p;
  $("score").textContent=st.score;
  if(st.score>rec){rec=st.score;$("rec").textContent=rec;try{localStorage.setItem("gs_rec",rec)}catch(e){}}
  $("mTitle").textContent=c.d===0?"Raak! 🎯":c.d<=5?"Bijna! 👏":c.d<=25?"Niet slecht":"Volgende keer beter";
  $("mNum").textContent=fmt(c.v);
  $("mText").textContent=c.d===0?"Precies "+st.target+".":"Verschil met "+st.target+": "+fmt(c.d);
  $("mPts").textContent="+"+p+" punten";
  $("mHelp").textContent=c.d===0?"":"Mogelijke oplossing: "+st.solution;
  $("modal").classList.add("show");
  vib(c.d===0?[20,40,20]:15);
}
$("undo").addEventListener("click",undo);
$("reset").addEventListener("click",function(){if(!st.over)resetBoard()});
$("next").addEventListener("click",function(){st.round++;startRound()});
// voorkom pinch-zoom en dubbel-tik zoom op iOS
["gesturestart","gesturechange"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()})});
var lastTouch=0;
document.addEventListener("touchend",function(e){var n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
startRound();
})();
</script>
</body>
</html>
